<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>乙游陪伴 · 本地预览</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      background: radial-gradient(120% 80% at 50% 0%, #1a2130, #06080c 60%);
      color: #e8e4dc; font: 13px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .bar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 14px 16px; width: 100%; max-width: 820px;
    }
    .bar__title { font-weight: 600; margin-right: auto; letter-spacing: .12em; color: #e8c98a; }
    .bar select, .bar button {
      font: 12.5px/1.4 inherit; padding: 6px 11px; border-radius: 8px;
      border: 1px solid rgba(232,201,138,.24); background: rgba(255,255,255,.05); color: #e8e4dc; cursor: pointer;
    }
    .bar button:active { background: rgba(255,255,255,.12); }
    .bar label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #9a948a; cursor: pointer; }
    .stage { padding: 4px 16px 34px; }
    .phone {
      width: 390px; height: 844px; background: #0a0d13; border-radius: 34px;
      box-shadow: 0 28px 70px rgba(0,0,0,.7), 0 0 0 10px #12151c, 0 0 0 11px rgba(232,201,138,.14);
      overflow: hidden; position: relative;
    }
    .phone__notch {
      display: none;
    }
    #mount { width: 100%; height: 100%; overflow: hidden; }
    #err {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      max-width: 680px; background: #2b1414; color: #ffb4b4; border: 1px solid #5a2626;
      padding: 10px 14px; border-radius: 10px; font: 12px/1.5 ui-monospace, Consolas, monospace;
      white-space: pre-wrap; display: none; z-index: 99999;
    }
    .tip { width: 100%; max-width: 820px; padding: 0 16px 26px; color: #6c6862; font-size: 11.5px; line-height: 1.7; }
  </style>
</head>

<body>
  <div class="bar">
    <div class="bar__title">乙游陪伴 · 本地预览</div>
    <select id="appSel"></select>
    <button id="reload">重载</button>
    <button id="clear">清空模拟存储</button>
    <button id="mockPortrait">塞一张演示立绘</button>
    <label><input type="checkbox" id="failAi"> 模拟 AI 失败</label>
    <label><input type="checkbox" id="slowAi"> 模拟 AI 很慢</label>
  </div>

  <div class="stage">
    <div class="phone">
      <div class="phone__notch"></div>
      <div id="mount"></div>
    </div>
  </div>

  <div class="tip">
    假宿主只用于看界面与交互。safe-area、字体、真实 AI、后台计时必须在真机验证。
  </div>

  <div id="err"></div>

  <script src="./mock-host.js"></script>
  <script>
    (function () {
      var errEl = document.getElementById('err');
      function showError(msg) {
        errEl.style.display = 'block';
        errEl.textContent = msg;
      }
      window.addEventListener('error', function (e) { showError('运行错误：' + e.message); });
      window.addEventListener('unhandledrejection', function (e) {
        showError('未处理的 Promise 拒绝：' + ((e.reason && e.reason.message) || e.reason));
      });

      var script = document.createElement('script');
      script.src = '../plugin.js';
      script.onerror = function () {
        showError('脚本加载失败：../plugin.js\n先执行 npm run build');
      };
      script.onload = function () { bootstrap(); };
      document.body.appendChild(script);

      function bootstrap() {
        var mountEl = document.getElementById('mount');
        var appSel = document.getElementById('appSel');
        var current = null;

        function apps() {
          var p = window.__registeredPlugin;
          return (p && p.apps) || [];
        }

        async function mountApp(appId) {
          errEl.style.display = 'none';
          var list = apps();
          var app = list.filter(function (a) { return a.id === appId; })[0] || list[0];
          if (!app) { showError('没有找到已注册的 App'); return; }
          try {
            if (current && current.unmount) await current.unmount(mountEl, window.roche);
            mountEl.replaceChildren();
          } catch (e) { showError('卸载失败：' + e.message); }
          current = app;
          try {
            await app.mount(mountEl, window.roche);
          } catch (e) {
            showError('挂载失败：' + e.message + '\n' + (e.stack || ''));
          }
        }

        function fillSelect() {
          var list = apps();
          appSel.innerHTML = '';
          list.forEach(function (a) {
            var o = document.createElement('option');
            o.value = a.id;
            o.textContent = a.name + '（' + a.id + '）';
            appSel.appendChild(o);
          });
          if (!list.length) showError('插件没有注册任何 App');
        }

        appSel.addEventListener('change', function () { mountApp(appSel.value); });
        document.getElementById('reload').addEventListener('click', function () { location.reload(); });
        document.getElementById('clear').addEventListener('click', function () { window.__mock.reset(); });
        document.getElementById('failAi').addEventListener('change', function (e) {
          window.__mock.settings.failAi = e.target.checked;
        });
        document.getElementById('slowAi').addEventListener('change', function (e) {
          window.__mock.settings.slowAi = e.target.checked;
        });
        document.getElementById('mockPortrait').addEventListener('click', function () {
          injectDemoPortrait();
        });

        fillSelect();
        mountApp(appSel.value);
      }

      /** 生成一张渐变 + 剪影的占位立绘，直接写进模拟存储，方便看舞台效果 */
      function injectDemoPortrait() {
        var w = 620, h = 1000;
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');

        var bg = ctx.createLinearGradient(0, 0, 0, h);
        bg.addColorStop(0, 'rgba(0,0,0,0)');
        bg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        // 身体
        ctx.fillStyle = '#1b2230';
        ctx.beginPath();
        ctx.moveTo(w * 0.5, h * 0.30);
        ctx.quadraticCurveTo(w * 0.22, h * 0.42, w * 0.2, h);
        ctx.lineTo(w * 0.8, h);
        ctx.quadraticCurveTo(w * 0.78, h * 0.42, w * 0.5, h * 0.30);
        ctx.closePath();
        ctx.fill();

        // 脖子
        ctx.fillStyle = '#2e3546';
        ctx.fillRect(w * 0.44, h * 0.26, w * 0.12, h * 0.07);

        // 头
        ctx.beginPath();
        ctx.ellipse(w * 0.5, h * 0.185, w * 0.115, h * 0.085, 0, 0, Math.PI * 2);
        ctx.fill();

        // 头发
        ctx.fillStyle = '#39415a';
        ctx.beginPath();
        ctx.ellipse(w * 0.5, h * 0.155, w * 0.13, h * 0.07, 0, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(w * 0.37, h * 0.15, w * 0.055, h * 0.09);
        ctx.fillRect(w * 0.575, h * 0.15, w * 0.055, h * 0.09);

        // 眼睛
        ctx.fillStyle = '#e8c98a';
        ctx.beginPath();
        ctx.ellipse(w * 0.462, h * 0.19, w * 0.016, h * 0.007, 0, 0, Math.PI * 2);
        ctx.ellipse(w * 0.538, h * 0.19, w * 0.016, h * 0.007, 0, 0, Math.PI * 2);
        ctx.fill();

        var dataUrl = canvas.toDataURL('image/webp', 0.9);
        var store = {};
        try { store = JSON.parse(localStorage.getItem('otome-companion:mock-storage') || '{}'); } catch (e) { store = {}; }

        var id = 'demo' + Date.now().toString(36);
        store['oc:asset:' + id] = dataUrl;
        store['oc:assetIndex'] = Object.assign({}, store['oc:assetIndex'] || {}, (function () {
          var o = {};
          o[id] = { name: '演示立绘', slot: 'portrait', w: w, h: h, at: Date.now() };
          return o;
        })());
        store['oc:wardrobe'] = [{ id: 'of_demo', name: '演示立绘', ref: 'local:' + id, at: Date.now() }];
        store['oc:settings'] = Object.assign({}, store['oc:settings'] || {}, {
          outfitId: 'of_demo',
          onboardingDone: true
        });
        localStorage.setItem('otome-companion:mock-storage', JSON.stringify(store));
        window.__mock.toast('已塞入演示立绘，正在重载');
        setTimeout(function () { location.reload(); }, 500);
      }
    })();
  </script>
</body>

</html>
